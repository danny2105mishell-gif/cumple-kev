    <style>
        :root {
            --poke-red: #e61919;
            --bg-dark: #0a0505;
        }
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-retro { font-family: 'VT323', monospace; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(#3a0000 1px, transparent 1px),
                radial-gradient(#3a0000 1px, #0a0505 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Animations */
        @keyframes pack-float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-pack {
            animation: pack-float 3s infinite ease-in-out;
        }

        @keyframes pack-shake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg) scale(1.05); }
            40% { transform: rotate(8deg) scale(1.05); }
            60% { transform: rotate(-5deg) scale(1.03); }
            80% { transform: rotate(5deg) scale(1.03); }
        }
        .animate-shake {
            animation: pack-shake 0.5s ease-in-out;
        }

        @keyframes pokeball-throw {
            0% { transform: translate(-100px, 100px) scale(0.4) rotate(0deg); }
            50% { transform: translate(0px, -80px) scale(1.2) rotate(360deg); }
            100% { transform: translate(0px, 0px) scale(1) rotate(720deg); }
        }
        .animate-throw {
            animation: pokeball-throw 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Holo Shiny Card Effect */
        .holo-shiny {
            background: linear-gradient(135deg, rgba(230,25,25,0.3) 0%, rgba(20,0,0,0.8) 40%, rgba(255,203,5,0.3) 70%, rgba(230,25,25,0.3) 100%);
            background-size: 200% 200%;
            animation: holoGrad 4s infinite linear;
        }
        @keyframes holoGrad {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* 3D Flip Card Effect */
        .flip-card {
            background-color: transparent;
            height: 230px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .flip-card-front {
            background: linear-gradient(135deg, #1f0000, #400000);
            border: 3px solid #e61919;
        }
        .flip-card-back {
            background: #120404;
            color: #fff;
            transform: rotateY(180deg);
            border: 3px solid #ffcb05;
            overflow-y: auto;
        }

        .imgur-img {
            max-width: 100%;
            max-height: 380px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;

        function nextScene() {

        function playBeep() {
            if (!isAudioOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        function toggleAudio() {
            isAudioOn = !isAudioOn;
            document.getElementById('audio-text').innerText = isAudioOn ? "ON" : "OFF";
            document.getElementById('audio-icon').className = isAudioOn ? "fas fa-volume-up text-xs text-emerald-400" : "fas fa-volume-mute text-xs text-slate-500";
        }

        function triggerHearts() {
